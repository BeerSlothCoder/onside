[package]
name = "onside"
version = "0.1.0"
description = "Onside — in-play parimutuel markets settled by TxLINE Merkle-proof-verified data"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "onside"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
